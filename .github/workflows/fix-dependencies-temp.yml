name: Temporary dependency security fix

on:
  push:
    branches:
      - security/dependency-fixes-2026-08

permissions:
  contents: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-fixes-2026-08

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update vulnerable dependencies
        run: |
          npm install react-router-dom@^7.18.0 --package-lock-only
          npm update js-yaml --package-lock-only

      - name: Commit dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix vulnerable npm dependencies"
          git push
